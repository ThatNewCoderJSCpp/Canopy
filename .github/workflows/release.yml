name: Release

env:
  CANOPY_GITHUB_CLIENT_ID: "Ov23liJfPRt629ljZSIv"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    name: Check the version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(sed -n 's/^project(canopy VERSION \([0-9][0-9.]*\).*/\1/p' CMakeLists.txt | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::CMakeLists.txt says VERSION $version but the tag is $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Wait for the Walnut release Canopy bundles
        shell: bash
        run: |
          walnut=$(sed -n 's/^set(CANOPY_WALNUT_VERSION "\([0-9][0-9.]*\)".*/\1/p' CMakeLists.txt | head -n 1)
          if [ -z "$walnut" ]; then
            echo "::error::couldn't read CANOPY_WALNUT_VERSION from CMakeLists.txt"
            exit 1
          fi
          base="https://github.com/ThatNewCoderJSCpp/Walnut/releases/download/v$walnut"
          files="linux-x86_64.tar.gz linux-arm64.tar.gz linux-i686.tar.gz windows-ucrt64.zip windows-ucrt64-with-compiler.zip windows-i686.zip windows-i686-with-compiler.zip windows-clangarm64.zip windows-clangarm64-with-compiler.zip"
          for attempt in $(seq 1 60); do
            missing=""
            for f in $files; do
              curl -sfIL -o /dev/null "$base/Walnut-$walnut-$f" || missing="$missing Walnut-$walnut-$f"
            done
            if [ -z "$missing" ]; then
              echo "Walnut $walnut's release has every package"
              exit 0
            fi
            echo "Walnut $walnut's release doesn't have$missing yet (check $attempt of 60); its release workflow is probably still running, so waiting a minute"
            sleep 60
          done
          echo "::error::Walnut $walnut's release still doesn't have$missing after an hour. Check that Walnut's v$walnut release workflow finished, or change CANOPY_WALNUT_VERSION in CMakeLists.txt"
          exit 1

      - name: Check the GitHub sign-in app
        shell: bash
        run: |
          if [ -z "$CANOPY_GITHUB_CLIENT_ID" ]; then
            echo "::warning::CANOPY_GITHUB_CLIENT_ID at the top of release.yml is empty, so this release can't sign in to GitHub through the browser; it will offer pasting a token instead"
          fi

  linux:
    name: Linux ${{ matrix.arch }}
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config rpm dpkg-dev file desktop-file-utils \
            libx11-dev libxft-dev libxrender-dev libfontconfig1-dev libfreetype-dev \
            libssl-dev libpango1.0-dev libcairo2-dev zlib1g-dev libjpeg-dev \
            libvulkan-dev libgl-dev

      - name: Configure
        run: |
          lib=/usr/lib/$(gcc -print-multiarch)
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCANOPY_PACKAGE=ON -DFIZMO_TUNE=OFF \
            -DCANOPY_GITHUB_CLIENT_ID="$CANOPY_GITHUB_CLIENT_ID" \
            -DCANOPY_PACKAGE_PLATFORM=linux-${{ matrix.arch }} \
            -DJPEG_LIBRARY=$lib/libjpeg.a -DJPEG_LIBRARY_RELEASE=$lib/libjpeg.a \
            -DZLIB_LIBRARY=$lib/libz.a -DZLIB_LIBRARY_RELEASE=$lib/libz.a

      - name: Build
        timeout-minutes: 100
        run: cmake --build build -j 4

      - name: Test
        timeout-minutes: 20
        working-directory: build
        run: ctest --output-on-failure --timeout 300

      - name: Check canopy only needs common system libraries
        run: |
          for exe in build/bin/canopy build/bin/grove; do
            readelf -d $exe | grep NEEDED
            if readelf -d $exe | grep NEEDED | grep -E "libjpeg|libz\.|libstdc\+\+|libgcc_s"; then
              echo "::error::$exe links to a library users may not have"
              exit 1
            fi
          done

      - name: Package
        working-directory: build
        run: cpack

      - name: Test the archive
        run: |
          mkdir -p smoke
          tar -xzf build/Canopy-*.tar.gz -C smoke
          app=$(echo smoke/Canopy-*)
          $app/bin/canopy version
          $app/bin/canopy doctor | tee doctor.txt
          grep -E "Walnut +ok .*\(bundled\)" doctor.txt
          grep -E "Grove +ok .*\(bundled\)" doctor.txt
          printf 'import module.io\n\nfunction main() -> int {\n    std::io::println("packaged walnut works");\n    return 0;\n} end function main\n' > smoke/ok.wal
          $app/bin/canopy run smoke/ok.wal | grep "packaged walnut works"
          HOME=$PWD/smoke/home $app/bin/canopy install --desktop
          test -L smoke/home/.local/bin/canopy
          desktop-file-validate smoke/home/.local/share/applications/canopy.desktop
          test -f smoke/home/.local/share/mime/packages/canopy.xml
          test -f smoke/home/.local/share/icons/hicolor/scalable/mimetypes/text-x-walnut.svg
          grep "text/x-walnut-header:\*.walh" smoke/home/.local/share/mime/globs2
          HOME=$PWD/smoke/home $app/bin/canopy uninstall
          test ! -e smoke/home/.local/bin/canopy

      - name: Test the .deb
        run: |
          sudo apt-get install -y ./build/Canopy-*.deb
          test -L /usr/bin/canopy
          desktop-file-validate /usr/share/applications/canopy.desktop
          test -f /usr/share/icons/hicolor/scalable/apps/canopy.svg
          test -f /usr/share/mime/packages/canopy.xml
          canopy version
          sudo apt-get remove -y canopy
          test ! -e /usr/bin/canopy
          test ! -e /usr/share/applications/canopy.desktop

      - uses: actions/upload-artifact@v4
        with:
          name: canopy-linux-${{ matrix.arch }}
          path: |
            build/Canopy-*.tar.gz
            build/Canopy-*.tar.xz
            build/Canopy-*.zip
            build/Canopy-*.deb
            build/Canopy-*.rpm
          if-no-files-found: error

  linux-i686:
    name: Linux i686
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build, test and package in a 32-bit container
        run: |
          docker run --rm --platform linux/386 -e CANOPY_GITHUB_CLIENT_ID -v "$PWD:/src" -w /src i386/debian:bookworm bash -euo pipefail -c '
            apt-get update
            apt-get install -y --no-install-recommends ca-certificates git g++ cmake ninja-build pkg-config file rpm dpkg-dev binutils \
              libx11-dev libxft-dev libxrender-dev libfontconfig-dev libfreetype-dev \
              libssl-dev libpango1.0-dev libcairo2-dev zlib1g-dev libjpeg-dev \
              libvulkan-dev libgl-dev
            lib=/usr/lib/$(gcc -print-multiarch)
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCANOPY_PACKAGE=ON -DFIZMO_TUNE=OFF \
              -DCANOPY_GITHUB_CLIENT_ID="$CANOPY_GITHUB_CLIENT_ID" \
              -DCANOPY_PACKAGE_PLATFORM=linux-i686 \
              -DJPEG_LIBRARY=$lib/libjpeg.a -DJPEG_LIBRARY_RELEASE=$lib/libjpeg.a \
              -DZLIB_LIBRARY=$lib/libz.a -DZLIB_LIBRARY_RELEASE=$lib/libz.a
            cmake --build build -j 4
            (cd build && ctest --output-on-failure)
            (cd build && cpack)
            mkdir -p smoke
            tar -xzf build/Canopy-*.tar.gz -C smoke
            smoke/Canopy-*/bin/canopy version
            smoke/Canopy-*/bin/canopy doctor
          '

      - uses: actions/upload-artifact@v4
        with:
          name: canopy-linux-i686
          path: |
            build/Canopy-*.tar.gz
            build/Canopy-*.tar.xz
            build/Canopy-*.zip
            build/Canopy-*.deb
            build/Canopy-*.rpm
          if-no-files-found: error

  windows:
    name: Windows ${{ matrix.platform }}
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-w64-mingw32
            platform: windows-ucrt64
            wine: true
          - target: i686-w64-mingw32
            platform: windows-i686
            wine: false
          - target: aarch64-w64-mingw32
            platform: windows-clangarm64
            wine: false
    env:
      LLVM_MINGW_VERSION: "20261020"
      LLVM_MINGW: llvm-mingw-20261020-ucrt-ubuntu-22.04-x86_64
      LLVM_MINGW_TARGET: ${{ matrix.target }}
      LLVM_MINGW_DEPS: ${{ github.workspace }}/windows-deps
      WINEDEBUG: -all
      WINEPREFIX: ${{ github.workspace }}/.wineprefix
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build zip unzip nsis p7zip-full
          if [ "${{ matrix.wine }}" = "true" ]; then sudo apt-get install -y wine64; fi

      - name: Cache llvm-mingw
        id: llvm-mingw-cache
        uses: actions/cache@v4
        with:
          path: ~/llvm-mingw
          key: ${{ env.LLVM_MINGW }}

      - name: Download llvm-mingw
        if: steps.llvm-mingw-cache.outputs.cache-hit != 'true'
        run: |
          curl -fL --retry 5 --retry-delay 10 -o /tmp/llvm-mingw.tar.xz "https://github.com/mstorsjo/llvm-mingw/releases/download/$LLVM_MINGW_VERSION/$LLVM_MINGW.tar.xz"
          mkdir -p ~/llvm-mingw
          tar -xf /tmp/llvm-mingw.tar.xz -C ~/llvm-mingw --strip-components=1

      - name: Put llvm-mingw on the PATH
        run: echo "$HOME/llvm-mingw/bin" >> "$GITHUB_PATH"

      - name: Cache the Windows libraries
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: windows-deps
          key: windows-deps-${{ env.LLVM_MINGW_TARGET }}-${{ env.LLVM_MINGW }}-${{ hashFiles('.github/scripts/windows-deps.sh', 'cmake/llvm-mingw.cmake') }}

      - name: Build zlib, libjpeg-turbo and the Vulkan headers
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: bash .github/scripts/windows-deps.sh "$LLVM_MINGW_TARGET" "$LLVM_MINGW_DEPS" "$RUNNER_TEMP/windows-deps-src"

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCANOPY_PACKAGE=ON -DFIZMO_TUNE=OFF \
            -DCMAKE_TOOLCHAIN_FILE=cmake/llvm-mingw.cmake \
            -DCANOPY_GITHUB_CLIENT_ID="$CANOPY_GITHUB_CLIENT_ID" \
            -DCANOPY_PACKAGE_PLATFORM=${{ matrix.platform }} \
            -DJPEG_LIBRARY="$LLVM_MINGW_DEPS/lib/libjpeg.a" -DJPEG_INCLUDE_DIR="$LLVM_MINGW_DEPS/include" \
            -DZLIB_LIBRARY="$LLVM_MINGW_DEPS/lib/libzs.a" -DZLIB_INCLUDE_DIR="$LLVM_MINGW_DEPS/include"

      - name: Build
        timeout-minutes: 100
        run: cmake --build build -j 4

      - name: Check canopy only needs DLLs that come with Windows
        run: |
          for exe in build/bin/canopy.exe build/bin/canopy-gui.exe build/bin/grove.exe; do
            $LLVM_MINGW_TARGET-objdump -p $exe | grep "DLL Name"
            if $LLVM_MINGW_TARGET-objdump -p $exe | grep "DLL Name" | grep -iE "libstdc|libgcc|libwinpthread|libc\+\+|libunwind|zlib|libjpeg"; then
              echo "::error::$exe needs a DLL that users will not have"
              exit 1
            fi
          done

      - name: Package
        working-directory: build
        run: cpack

      - name: Package with the compiler
        working-directory: build
        run: |
          cmake -DCANOPY_BUNDLE_COMPILER=ON .
          cpack

      - name: Test under Wine
        if: matrix.wine
        timeout-minutes: 20
        working-directory: build
        run: |
          wineboot --init || true
          export WINEPATH="$(winepath -w "$(ls -d $PWD/walnut-bundle/Walnut-*/toolchain/llvm-mingw-*/bin | head -n 1)")"
          ctest --output-on-failure --timeout 300

      - name: Test the package with the compiler under Wine
        if: matrix.wine
        run: |
          mkdir -p smoke
          unzip -q build/Canopy-*-with-compiler.zip -d smoke
          app=$(echo smoke/Canopy-*)
          wine $app/bin/canopy.exe version
          wine $app/bin/canopy.exe doctor | tee doctor.txt
          grep -E "C\+\+ +ok .*\(bundled\)" doctor.txt
          grep -E "Walnut +ok .*\(bundled\)" doctor.txt
          printf 'import module.io\n\nfunction main() -> int {\n    std::io::println("packaged walnut works");\n    return 0;\n} end function main\n' > smoke/ok.wal
          wine $app/bin/canopy.exe run smoke/ok.wal | grep "packaged walnut works"
          printf '#include <stdio.h>\nint main(void) { puts("bundled c works"); return 0; }\n' > smoke/hi.c
          wine $app/bin/canopy.exe run smoke/hi.c | grep "bundled c works"

      - uses: actions/upload-artifact@v4
        with:
          name: canopy-${{ matrix.platform }}
          path: |
            build/Canopy-*.zip
            build/Canopy-*.7z
            build/Canopy-*.exe
          compression-level: 0
          if-no-files-found: error

  windows-native:
    name: Run on Windows ${{ matrix.platform }}
    needs: windows
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-ucrt64
            runner: windows-latest
          - platform: windows-i686
            runner: windows-latest
          - platform: windows-clangarm64
            runner: windows-11-arm
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: canopy-${{ matrix.platform }}
          path: packages

      - name: Run the package with the compiler
        run: |
          $zip = Get-ChildItem packages/Canopy-*-with-compiler.zip | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath bundled
          $app = (Get-ChildItem bundled -Directory | Select-Object -First 1).FullName
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot;$env:SystemRoot\System32\WindowsPowerShell\v1.0"
          & "$app\bin\canopy.exe" doctor
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Set-Content ok.wal "import module.io`n`nfunction main() -> int {`n    std::io::println(`"packaged walnut works`");`n    return 0;`n} end function main`n"
          $out = & "$app\bin\canopy.exe" run ok.wal
          $out
          if (-not ($out -match "packaged walnut works")) { exit 1 }
          Set-Content hi.c "#include <stdio.h>`nint main(void) { puts(`"bundled c works`"); return 0; }`n"
          $out = & "$app\bin\canopy.exe" run hi.c
          $out
          if (-not ($out -match "bundled c works")) { exit 1 }

      - name: Run the plain package
        run: |
          $zip = Get-ChildItem packages/Canopy-*.zip | Where-Object { $_.Name -notlike "*-with-compiler.zip" } | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath plain
          $app = (Get-ChildItem plain -Directory | Select-Object -First 1).FullName
          & "$app\bin\canopy.exe" version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & "$app\bin\canopy.exe" doctor

  publish:
    name: Attach packages to the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, linux-i686, windows, windows-native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: packages/*
          fail_on_unmatched_files: true
